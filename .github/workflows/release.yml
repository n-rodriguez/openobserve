on:
  workflow_dispatch:
name: Release

# Read-only: this branch only builds a binary, it publishes nothing.
permissions:
  contents: read

env:
  RUST_TOOLCHAIN: nightly-2026-05-20
jobs:
  build:
    name: Build binary
    strategy:
      matrix:
        include:
          - arch: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            features: "--features mimalloc"
            # Nom fixe : sur workflow_dispatch, github.ref_name est la branche,
            # et un nom de branche contenant « / » casserait l'archive.
            file_name: openobserve-mcp-tls-linux-amd64
            file_ext: .tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: ./.github/actions/github-auth
      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Build UI
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
        run: |
          cd web/
          npm ci
          npm run build

      - name: Install Protoc for linux
        if: contains(matrix.arch, 'x86_64-unknown-linux') || contains(matrix.arch, 'linux-musl')
        run: | # Make sure the protoc is >= 3.15
          wget https://github.com/protocolbuffers/protobuf/releases/download/v21.12/protoc-21.12-linux-x86_64.zip
          unzip protoc-21.12-linux-x86_64.zip -d protoc
          sudo cp protoc/bin/protoc /usr/local/bin/
          sudo cp -r protoc/include/google /usr/local/include/

      - name: Install Protoc for linux ARM
        if: contains(matrix.arch, 'aarch64-unknown-linux') && contains(matrix.arch, 'linux-musl') == false
        run: | # Make sure the protoc is >= 3.15
          wget https://github.com/protocolbuffers/protobuf/releases/download/v21.12/protoc-21.12-linux-aarch_64.zip
          unzip protoc-21.12-linux-aarch_64.zip -d protoc
          sudo cp protoc/bin/protoc /usr/local/bin/
          sudo cp -r protoc/include/google /usr/local/include/
  
      - name: Install Protoc for windows
        if: contains(matrix.arch, 'windows')
        shell: bash
        run: |
          curl -L -o protoc-21.12-win64.zip https://github.com/protocolbuffers/protobuf/releases/download/v21.12/protoc-21.12-win64.zip
          unzip protoc-21.12-win64.zip -d protoc
          cp protoc/bin/protoc.exe C:/windows/system32/protoc.exe
          cp -r protoc/include/google C:/windows/system32/
  
      - name: Install Protoc for macos
        if: contains(matrix.arch, 'darwin')
        run: |
          brew install protobuf coreutils boost

      - name: Install dependencies for linux
        if: contains(matrix.arch, 'linux-gnu')
        run: |
          sudo apt-get -y update
          sudo apt-get -y install libssl-dev pkg-config gcc g++ g++-aarch64-linux-gnu gcc-aarch64-linux-gnu musl-dev musl-tools

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.arch }}

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          prefix-key: release-${{ matrix.arch }}
          # Release target directories are multi-GB and have low cross-tag
          # reuse. Keep Cargo registry/git inputs without crowding PR caches.
          cache-targets: false

      - name: Install cross-rs
        if: contains(matrix.arch, 'linux-musl')
        run: RUSTFLAGS="" cargo install cross --git https://github.com/cross-rs/cross --force

      - name: Output package versions
        run: protoc --version ; cargo version ; rustc --version ; gcc --version ; g++ --version

      - name: Print rustc cfg
        run: rustc -C target-cpu=native --print cfg

      # release-ci, not release-prod: the latter's codegen-units=1 + thin LTO link step exhausts an ubuntu-latest runner (shutdown signal, exit 143).
      - name: Run cargo build (standard)
        if: contains(matrix.file_name, '-simd') == false && contains(matrix.arch, 'linux-musl') == false
        run: cargo build ${{ matrix.features }} --profile release-ci --target ${{ matrix.arch }}

      - name: Run cargo build (musl)
        if: contains(matrix.arch, 'linux-musl')
        env:
          CROSS_CONFIG: Cross.oss.toml
        run: cross build ${{ matrix.features }} --profile release-ci --target ${{ matrix.arch }}

      - name: Run cargo build (SIMD)
        if: contains(matrix.file_name, '-simd')
        run: RUSTFLAGS='-C target-feature=+aes,+avx,+avx2,+sse2,+sse3,+ssse3,+sse4.1,+sse4.2,+avx512f,+avx512cd,+avx512bw,+avx512dq,+avx512vl' cargo build ${{ matrix.features }} --profile release-ci --target ${{ matrix.arch }}

      - name: Calculate checksum and rename binary
        if: contains(matrix.arch, 'windows') == false
        shell: bash
        run: |
          cd target/${{ matrix.arch }}/release-ci
          chmod +x openobserve
          tar -zcvf ${{ matrix.file_name }}.tar.gz openobserve
          echo $(shasum -a 256 ${{ matrix.file_name }}.tar.gz | cut -f1 -d' ') > ${{ matrix.file_name }}.tar.gz.sha256sum

      - name: Calculate checksum and rename binary for windows
        if: contains(matrix.arch, 'windows')
        shell: bash
        run: |
          cd target/${{ matrix.arch }}/release-ci
          7z a -tzip ${{ matrix.file_name }}.zip openobserve.exe
          certutil.exe -hashfile ${{ matrix.file_name }}.zip sha256|head -n 2|tail -n 1 > ${{ matrix.file_name }}.zip.sha256sum

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.file_name }}
          path: target/${{ matrix.arch }}/release-ci/${{ matrix.file_name }}${{ matrix.file_ext }}

      - name: Upload checksum of artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.file_name }}.sha256sum
          path: target/${{ matrix.arch }}/release-ci/${{ matrix.file_name }}${{ matrix.file_ext }}.sha256sum
